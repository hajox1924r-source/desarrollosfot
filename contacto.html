<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BABYMETAL - Contacto</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>Contacto</h1>

    <nav>
        <ul>
            <li><a href="index.html">Inicio</a></li>
            <li><a href="banda.html">La banda</a></li>
            <li><a href="trayectoria.html">Trayectoria</a></li>
            <li><a href="habilidades.html">Habilidades</a></li>
            <li><a href="discografia.html">Discografía</a></li>
            <li><a href="contacto.html">Contacto</a></li>
        </ul>
    </nav>
</header>

<main>

<section>

    <h2>Escríbenos sobre esta página</h2>

    <p>
        ¿Eres fan de BABYMETAL o tienes comentarios sobre este trabajo?
        Déjanos tu mensaje.
    </p>

    <form>

        <fieldset>
            <legend>Datos del mensaje</legend>

            <p>
                <label for="nombre">Nombre completo:</label><br>
                <input
                    type="text"
                    id="nombre"
                    name="nombre"
                    autocomplete="name"
                    required
                    placeholder="Escribe tu nombre">
            </p>

            <p>
                <label for="correo">Correo electrónico:</label><br>
                <input
                    type="email"
                    id="correo"
                    name="correo"
                    autocomplete="email"
                    required
                    placeholder="nombre@correo.com">
            </p>

            <p>
                <label for="cancion">Canción favorita:</label><br>
                <input
                    type="text"
                    id="cancion"
                    name="cancion"
                    list="canciones"
                    placeholder="Gimme Chocolate!!, Ratatata…">
                <datalist id="canciones">
                    <option value="Gimme Chocolate!!">
                    <option value="RATATATA">
                    <option value="Karate">
                    <option value="Megitsune">
                    <option value="PA PA YA!!">
                    <option value="Road of Resistance">
                </datalist>
            </p>

            <p>
                <label for="miembro">Integrante favorita:</label><br>
                <select id="miembro" name="miembro">
                    <option value="">— Elige una —</option>
                    <option value="su">SU-METAL</option>
                    <option value="moa">MOAMETAL</option>
                    <option value="momo">MOMOMETAL</option>
                </select>
            </p>

            <p>
                <label for="mensaje">Mensaje:</label><br>

                <textarea
                    id="mensaje"
                    name="mensaje"
                    rows="4"
                    cols="40"
                    maxlength="300"
                    required
                    placeholder="Cuéntanos qué te pareció la página"></textarea>
            </p>

        </fieldset>

        <p>
            <button type="submit">Enviar mensaje</button>
        </p>

    </form>

</section>

</main>

<footer>
    <p><a href="index.html">Volver al inicio</a></p>
</footer>

</body>
</html>
